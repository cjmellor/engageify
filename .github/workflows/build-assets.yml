name: Build Assets

on: ["push", "pull_request"]

jobs:
  assets:
    runs-on: ubuntu-latest

    name: Verify the committed impression script

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Rebuild the impression script
        run: bun run build

      - name: Fail if the committed artifact is stale
        run: git diff --exit-code resources/js/dist

      - name: Run the JavaScript tests
        run: bun test resources/js
